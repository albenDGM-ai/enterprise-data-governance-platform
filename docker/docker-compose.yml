services:

  postgres:
    image: postgres:17
    container_name: governance_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: governance_admin
      POSTGRES_PASSWORD: governance_password
      POSTGRES_DB: enterprise_governance

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U governance_admin -d enterprise_governance"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: governance_backend

    restart: unless-stopped

    volumes:
      - ../backend:/app

    environment:
      DATABASE_URL: postgresql+psycopg2://governance_admin:governance_password@postgres:5432/enterprise_governance

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
